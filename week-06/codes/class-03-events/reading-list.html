<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading List — Week 6 C3</title>

  <!--
    WEEK 6 CLASS 3 — Events
    ------------------------------------------------
    The HTML and the CSS are written for you. You write
    reading-list.js.

    Note the three ids your script needs:
      #book-form   the form (listen for "submit", not "click")
      #shelf       the empty <ul> your rows go into
      #count       the summary line

    Open with Live Server and keep the Console open.
  -->

  <style>
    :root {
      --navy: #003366;
      --line: #d6dee6;
      --panel: #f2f5f8;
      --red: #b3261e;
      --red-soft: #fbeae8;
      --ink: #1a2733;
      --muted: #6b7a88;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0; padding: 2rem 1rem;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink); line-height: 1.5;
    }

    main { max-width: 640px; margin: 0 auto; }

    h1 { color: var(--navy); font-size: 1.6rem; margin: 0 0 0.25rem; }
    .sub { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.9rem; }

    /* ---- the form ---- */

    #book-form {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    #book-form input {
      flex: 1 1 8rem;
      padding: 0.5rem 0.65rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.9rem;
    }

    #book-form input[type="number"] { flex: 0 0 6rem; }

    #book-form button {
      flex: 0 0 auto;
      padding: 0.5rem 1.1rem;
      border: none;
      border-radius: 4px;
      background: var(--navy);
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
    }

    #book-form input:focus-visible,
    #book-form button:focus-visible,
    .remove-btn:focus-visible {
      outline: 3px solid #e39a18;
      outline-offset: 2px;
    }

    /* ---- the list ---- */

    #shelf { list-style: none; margin: 0; padding: 0; }

    #shelf li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      padding: 0.6rem 0.85rem;
      margin-bottom: 0.6rem;
    }

    #shelf .title { font-weight: bold; color: var(--navy); }
    #shelf .meta  { font-size: 0.8rem; color: var(--muted); }

    .remove-btn {
      border: 1px solid var(--red);
      border-radius: 4px;
      background: var(--red-soft);
      color: var(--red);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 0.25rem 0.6rem;
      cursor: pointer;
    }

    #count { margin-top: 1.25rem; font-weight: bold; color: var(--navy); }

    .empty { color: var(--muted); font-style: italic; }

    /*
      Every input needs a label (Week 2 accessibility checklist).
      A placeholder is not a label: it disappears as soon as you
      type, and screen readers may skip it.
      This hides the label visually but keeps it for screen readers.
    */
    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>

  <main>
    <h1>Reading List</h1>
    <p class="sub">CSE-2340 Software Development 1 &middot; Autumn 2026</p>

    <!--
      A real <form>, not a div with a button.
      Listening for "submit" on the form also catches the Enter key.
      A button inside a form is type="submit" by default.
    -->
    <form id="book-form">
      <label class="visually-hidden" for="title">Title</label>
      <input id="title" type="text" placeholder="Title" required>

      <label class="visually-hidden" for="author">Author</label>
      <input id="author" type="text" placeholder="Author">

      <label class="visually-hidden" for="year">Year</label>
      <input id="year" type="number" placeholder="Year">

      <button type="submit">Add</button>
    </form>

    <!-- EMPTY ON PURPOSE. Your script fills it. -->
    <ul id="shelf"></ul>

    <p id="count">Loading...</p>
  </main>

  <script src="reading-list.js" defer></script>

</body>
</html>
